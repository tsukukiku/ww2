<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sky Front 1944</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-panel" aria-label="Sky Front 1944">
        <canvas id="game" width="480" height="720"></canvas>
        <div id="overlay" class="overlay">
          <div class="title">Sky Front 1944</div>
          <button id="startButton" type="button">SORTIE</button>
        </div>
      </section>

      <aside class="hud" aria-label="status">
        <div class="brand">Sky Front 1944</div>
        <div class="stat">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>Stage</span>
          <strong id="wave">1</strong>
        </div>
        <div class="stat">
          <span>Armor</span>
          <strong id="lives">5</strong>
        </div>
        <div class="stat">
          <span>Guns</span>
          <strong id="power">P-51D</strong>
        </div>
        <div class="controls">
          <span>Move: WASD / Arrows</span>
          <span>Fire: Space</span>
          <span>Pause: P</span>
        </div>
      </aside>

      <div class="touch-controls" aria-hidden="true">
        <button data-touch="left">&#8592;</button>
        <button data-touch="fire">&#9679;</button>
        <button data-touch="right">&#8594;</button>
      </div>

      <section class="leaderboard" aria-label="leaderboard">
        <div class="leaderboard-title">TOP SCORES</div>
        <form id="scoreForm" class="score-form">
          <label for="pilotName">Pilot Name</label>
          <input id="pilotName" name="pilotName" type="text" maxlength="18" autocomplete="off" placeholder="guest score" disabled>
          <button id="saveScoreButton" type="submit" disabled>SAVE</button>
          <span id="scoreMessage" aria-live="polite">Finish a sortie to save your score</span>
        </form>
        <select id="leaderboardSelect" size="10" aria-label="top 10 scores"></select>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
